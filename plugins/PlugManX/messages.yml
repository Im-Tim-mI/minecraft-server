###
# PlugManX 訊息文件（繁體中文版）
#
# 訊息可以使用 http://minecraft.gamepedia.com/Formatting_codes 的格式代碼
# 使用 '&' 字元表示顏色代碼
# 確保自訂訊息使用單引號包圍
###

prefix: '&7[&aPlugMan&7] '

# ============================================
# 檢查更新訊息
# ============================================
check:
  header: '&9正在取得插件版本...'
  not-found: '&9插件未安裝 - 最新可用版本為 "{0}"。'
  not-found-spigot: '&c無法取得插件資料 - 該插件是否為 Spigot 資源？'
  out-of-date: '&c目前版本（&4{0}&c）與最新版本（&2{1}&c）不符。'
  out-of-date-player: '&c可能已過期（已安裝 → 最新）：{0}'
  up-to-date: '&9插件似乎已是最新版本 "{0}"。'
  up-to-date-player: '&a似乎已是最新版本（已安裝）：{0}'
  file-done: '&9檔案匯出完成：{0}'
  unknown: '&c版本資訊未知。'
  unknown-player: '&c未知（已安裝）：{0}'
  not-available: '&c無法取得 {0} 的版本資訊。'

# ============================================
# 停用插件訊息
# ============================================
disable:
  all: '&9所有插件已停用（PlugMan 除外）。'
  already-disabled: '&c{0} 已經停用。'
  disabled: '&9{0} 已停用。'

# ============================================
# 匯出訊息
# ============================================
dump:
  dumped: '&9插件清單已匯出至 {0}。'
  error: '&4無法匯出至檔案。'

# ============================================
# 啟用插件訊息
# ============================================
enable:
  all: '&9所有插件已啟用。'
  already-enabled: '&c{0} 已經啟用。'
  enabled: '&9{0} 已啟用。'

# ============================================
# 錯誤訊息
# ============================================
error:
  ignored: '&cPlugMan 已設定忽略該插件。'
  invalid-plugin: '&c這不是有效的插件。'
  no-permission: '&c你沒有權限執行此操作。'
  specify-plugin: '&c你必須指定一個插件。'
  specify-command: '&c你必須指定一個指令。'
  paper-plugin: "&cPaper 插件目前不支援，抱歉。"
  usage:
    command: '&7- &9指令：&7{0}'
    description: '&7- &9描述：&7{0}'
    usage: '&7- &9用法：&7{0}'

# ============================================
# 幫助選單
# ============================================
help:
  header: '&7--------------------- [&a PlugMan &7] ---------------------'
  help: '&7- &a/{0} help &f- &7顯示此幫助選單。'
  list: '&7- &a/{0} list [-v] &f- &7列出所有插件（-v 顯示版本）。'
  dump: '&7- &a/{0} dump &f- &7匯出插件名稱和版本至檔案。'
  info: '&7- &a/{0} info <插件> &f- &7查看插件資訊。'
  usage: '&7- &a/{0} usage <插件> &f- &7列出插件註冊的指令。'
  lookup: '&7- &a/{0} lookup <指令> &f- &7查詢指令屬於哪個插件。'
  enable: '&7- &a/{0} enable <插件|all> &f- &7啟用插件。'
  disable: '&7- &a/{0} disable <插件|all> &f- &7停用插件。'
  restart: '&7- &a/{0} restart <插件|all> &f- &7重啟插件。'
  load: '&7- &a/{0} load <插件> &f- &7載入插件。'
  reload: '&7- &a/{0} reload <插件|all> &f- &7重載插件。'
  unload: '&7- &a/{0} unload <插件> &f- &7卸載插件。'
  check: '&7- &a/{0} check <插件|all> [-f] &f- &7檢查插件是否為最新版（-f 匯出至檔案）。'

# ============================================
# 插件資訊
# ============================================
info:
  header: '插件資訊：{0}'
  version: '&7- 版本：&a{0}'
  authors: '&7- 作者：&a{0}'
  status: '&7- 狀態：{0}'
  depends: '&7- 依賴：{0}'
  softdepends: '&7- 軟依賴：&a{0}'

# ============================================
# 插件列表
# ============================================
list:
  list: '&9插件（{0}）：{1}'

# ============================================
# 載入插件訊息
# ============================================
load:
  already-loaded: '&c{0} 已經載入。'
  cannot-find: '&c找不到檔案，且搜尋描述失敗。'
  invalid-description: '&c該插件的描述無效。'
  invalid-plugin: '&c該檔案不是有效的插件。'
  loaded: '&9{0} 已載入並啟用。'
  plugin-dir: '&c找不到插件目錄。'

# ============================================
# 查詢指令訊息
# ============================================
lookup:
  found: '&9/{0} 註冊於 {1}。'
  not-found: '&c指令 "/{0}" 未在任何 plugin.yml 中註冊。'

# ============================================
# 重載插件訊息
# ============================================
reload:
  all: '&9所有插件已重載。'
  all-failed: '&c部分插件重載失敗：{0}'
  reloaded: '&9{0} 已重載。'

# ============================================
# 重啟插件訊息
# ============================================
restart:
  all: '&9所有插件已重啟。'
  restarted: '&9{0} 已重啟。'

# ============================================
# 卸載插件訊息
# ============================================
unload:
  failed: '&c卸載 {0} 失敗。'
  gentle-failed: '&c插件拒絕卸載。'
  unloaded: '&9{0} 已卸載。'

# ============================================
# 指令用法
# ============================================
usage:
  usage: '&9指令：&7{0}'
  no-commands: '&c未註冊任何指令。'