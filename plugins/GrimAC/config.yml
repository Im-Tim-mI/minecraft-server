# ============================================
# GrimAC 反作弊主配置文件（繁體中文翻譯版）
# ============================================
# 原始碼：https://github.com/MWHunter/Grim
# 版權所有 2025 DefineOutside 和貢獻者，採用 GPLv3 許可證。
# 修改過的二進制文件或複製 Grim 代碼的插件必須是私有的，
# 或向買家免費提供完整原始碼。
# ============================================

# ============================================
# 警報設定
# ============================================
alerts:
    # 除了向玩家廣播警報外，是否也應該發送到控制台？
    print-to-console: true

    # 此設定控制警報是否/如何在連接到代理的伺服器之間共享。
    # 如果使用 Velocity，你必須在 Velocity 配置中啟用 'bungee-plugin-message-channel'。
    proxy:
        # 是否將警報發送到連接到代理的其他伺服器？
        send: false
        # 是否應該在此伺服器上宣布從其他伺服器收到的警報？
        receive: false

# ============================================
# 詳細輸出設定
# ============================================
verbose:
    # 是否在控制台列印詳細資訊（用於除錯）
    print-to-console: false

# 是否檢查更新
check-for-updates: true

# ============================================
# 客戶端品牌設定
# ============================================
client-brand:
    # 如果客戶端品牌符合以下正則表達式，則不會向管理員廣播其品牌
    # 這些是被認為是正常/合法的客戶端
    ignored-clients:
        - "^vanilla$"                                                    # 原版
        - "^fabric$"                                                     # Fabric 模組載入器
        - "^lunarclient:v\\d+\\.\\d+\\.\\d+-\\d{4},(?:fabric|forge)$"   # Lunar Client
        - "^Feather Fabric$"                                             # Feather Client
        - "^labymod$"                                                    # LabyMod

    # Grim 將封鎖包含內建 Reach 作弊的特定 Forge 版本（Forge 1.18.2 到 1.19.3）。
    # 將此選項設為 false 將允許這些客戶端連接到伺服器。
    # 風險自負！
    disconnect-blacklisted-forge-versions: true

# ============================================
# 旁觀者設定
# ============================================
spectators:
    # 隱藏所有具有 grim.spectator 權限的旁觀者，無論他們是否正在實際旁觀
    hide-regardless: false

    # 旁觀者只在這些世界中隱藏，留空表示允許所有世界
    allowed-worlds:
        - ""

# ============================================
# 連線逾時設定
# ============================================
# 玩家多久沒回應後我們應該踢出他們？預設 = 60 秒
max-transaction-time: 60

# 啟用此選項以停止 Grim 取消從玩家收到的 pong 封包。
# 這可能會改善與其他反作弊插件的相容性，但可能會與封包限制器產生問題。
# 如果你不確定自己在做什麼，請勿啟用此選項。
disable-pong-cancelling: false

# 是否應該禁用預設的方塊重新同步處理器？
# 預設情況下，Grim 從伺服器世界讀取方塊並將它們發送到客戶端以修復不同步。
# 如果你使用創建假封包方塊（不存在於伺服器世界中）的插件，
# 你應該將此設為 true 以防止 Grim 用空氣/真實方塊覆蓋它們。
# 這會強制使用 "NoOp"（無操作）處理器，除非通過 API 提供了自訂處理器。
disable-default-resync-handler: false

# 是否應該取消重複的移動封包？
# Mojang 在 1.21 中修復了此問題。這是他們嘗試修復「水桶不同步」的方法。
# https://bugs.mojang.com/browse/MC-12363
# 此設定僅適用於 1.8 伺服器上的 1.17-1.20.5 客戶端。
cancel-duplicate-packet: true

# 是否忽略重複封包中的旋轉
ignore-duplicate-packet-rotation: false

# ============================================
# 模擬檢測設定（移動作弊檢測）
# ============================================
Simulation:
    # 當玩家是合法的時，我們應該將總優勢乘以多少
    # 預設配置圖表（x 軸 = 秒，y 軸 = 1/1000 方塊）：
    # https://www.desmos.com/calculator/d4ufgxrxer
    setback-decay-multiplier: 0.999

    # 與玩家移動的偏移量多大時應該創建違規？
    # 以方塊為單位測量，從可能的移動計算
    # 我們通過切換三角函數表來考慮 Optifine，但將此值降低到 0.001 可以減少 FastMath
    # 如果此補償不起作用時觸發反作弊...
    threshold: 0.01    # 原本 0.001，增加容忍度以減少誤判

    # 在一個 tick 中違規多大時玩家會立即被拉回？
    # -1 表示禁用
    immediate-setback-threshold: -1    # 原本 0.1，不那麼敏感

    # 所有 tick 的優勢多大時我們開始拉回？
    # -1 表示禁用
    max-advantage: -1    # 原本 1，允許更多優勢

    # 使用預設配置，50 秒後玩家將從 4 方塊優勢降到 1 方塊
    # 這是為了阻止玩家積累太多違規而永遠無法清除
    # 預設優勢上限圖表：https://www.desmos.com/calculator/4lovswdarj
    max-ceiling: 4  

    # 拉回的違規等級閾值
    # 1 表示舊行為
    setback-violation-threshold: 3  # 原本 1，需要更多違規才拉回

# ============================================
# 相位檢測（穿牆檢測）
# ============================================
# 檢查玩家是否在移動過程中進入了方塊
Phase:
    setbackvl: 1    # 穿入方塊可以允許爬牆，此檢測相對穩定
    decay: 0.005    # 衰減速率

# ============================================
# 方塊放置檢測
# ============================================
# 在空氣/液體中放置方塊
AirLiquidPlace:
    cancelvl: 0     # 違規等級達到此值時取消操作

# 偽造放置
FabricatedPlace:
    cancelvl: 5

# 遠距離放置
FarPlace:
    cancelvl: 5

# 位置放置
PositionPlace:
    cancelvl: 5

# 旋轉放置
RotationPlace:
    cancelvl: 5

# ============================================
# NoSlow 檢測（使用物品時減速作弊）
# ============================================
# 基於預測的 NoSlow 檢測
# Grim 在這裡考慮了有問題的網路代碼...即使狂按右鍵和副手按鈕也很難誤判
# 比其他反作弊更穩定，但請報告任何誤判...我已經修復了大量網路代碼問題。
NoSlow:
    # 多少偏移量算是「作弊」
    # 預設情況下這比其他偏移量低
    # 使用 NoSlow 時會持續觸發 0.03-0.2
    threshold: 0.001

    # 在第一個物品上快速拉回以消除 NoSlow 帶來的任何優勢
    setbackvl: 5

    # 當玩家使用物品且被其減速時衰減
    decay: 0.05

# ============================================
# 擊退檢測
# ============================================
Knockback:
    # 當玩家是合法的時，我們應該將總優勢乘以多少
    setback-decay-multiplier: 0.999

    # 與玩家速度的偏移量多大時應該創建違規？
    # 以方塊為單位測量，從可能的速度計算
    threshold: 0.001

    # 在一個 tick 中違規多大時玩家會立即被拉回？
    # -1 表示禁用
    immediate-setback-threshold: 0.1

    # 所有 tick 的優勢多大時我們開始拉回？
    # -1 表示禁用
    max-advantage: 1

    # 這是為了阻止玩家積累太多違規而永遠無法清除
    max-ceiling: 4

# ============================================
# 爆炸擊退檢測
# ============================================
Explosion:
    threshold: 0.001
    setbackvl: 3

# ============================================
# 計時器檢測（加速作弊）
# ============================================
TimerA:
    setbackvl: 10   # 違規等級達到此值時拉回

    # 玩家落後時可以積累供以後使用的毫秒數
    # 如果設太高，可能允許 1.8 快速使用/快速治療/快速弓繞過
    # 120 毫秒似乎是一個好的平衡
    drift: 120

# 此檢測通過防止玩家的移動落後於實時太多來限制 TimerA 餘額的濫用
TimerLimit:
    # 檢測開始限制計時器餘額的 ping 值，以防止濫用。
    # 可能對合法玩家造成一些拉回，但僅當他們超過此 ping 閾值時。
    # -1 表示禁用
    ping-abuse-limit-threshold: 1000

# 負計時器檢測（減速作弊）
NegativeTimer:
    # 在移動時損失多少毫秒後我們應該開始標記
    drift: 1200

# ============================================
# 載具計時器檢測
# ============================================
# 與 TimerA 相同的檢測方法，但用於載具
VehicleTimer:
    # 目標 1.005 計時器 (預設10)
    setbackvl: 10

# ============================================
# 封包順序檢測
# ============================================
PacketOrderI:
    # 如果玩家因使用 1.7 動畫模組而被標記，請啟用此選項
    exempt-placing-while-digging: false

# ============================================
# 觸及距離檢測（Reach 作弊）
# ============================================
Reach:
    # 我們應該將碰撞箱擴展多少？0.0005 應該能檢測 3.0005+ 觸及距離
    #
    # 由於協議更改和限制，1.9-1.18.1（不是 1.18.2）或某些客戶端/伺服器組合
    # 會有 0.03 強制擴展。此檢測在 1.8 伺服器上的 1.7/1.8 客戶端最強大。
    threshold: 0.0005

    # 我們是否應該取消我們知道不可能的攻擊？
    # 由於封包順序限制，3.00-3.03 的攻擊可能會通過但仍會被標記
    block-impossible-hits: true

    # 這將在每個 tick 結束時發送一個額外的封包，以增加捕獲作弊的可能性
    # 這會注入到伺服器的連接列表中，在伺服器刷新之前發送最後一個封包
    # 啟用此功能將增加所有玩家的頻寬使用
    # 這不會降低整體伺服器效能
    # 啟用此功能將捕獲更多作弊者
    # 禁用此功能仍然會捕獲作弊者，不會導致誤判
    # 除非你是專注於 1.8 PvP 的伺服器，否則不建議使用此額外封包
    enable-post-packet: false

# ============================================
# 漏洞利用設定
# ============================================
exploit:
    # 使用鞘翅時衝刺跳躍可以獲得高速，設為 false 時防止此漏洞
    # Mojang 搞砸了網路代碼，使鞘翅啟動是客戶端的，鞘翅結束是伺服器端的
    # 鞘翅有 0.99 水平摩擦，所以不斷添加 0.2 水平速度會導致非常高的速度。
    allow-sprint-jumping-when-using-elytra: true

    # 此選項通過在玩家放置幽靈方塊時重新同步來減輕問題
    allow-building-on-ghostblocks: true

    # 此設定受上面布爾值的影響，定義檢查幽靈方塊的距離
    # 其有效範圍限制在 2 到 4 之間
    distance-to-check-if-ghostblocks: 2

# ============================================
# 除錯設定
# ============================================
# 啟用記錄在加入時已注入到 netty 的插件，以除錯相容性問題
debug-pipeline-on-join: false

# 啟用實驗性檢測
experimental-checks: false

# ============================================
# 物品使用重置設定
# ============================================
# 物品更新時重置物品使用
reset-item-usage-on-item-update: true
# 攻擊時重置物品使用
reset-item-usage-on-attack: true
# 切換物品欄槽位時重置物品使用
reset-item-usage-on-slot-change: true
# 使用物品時重置物品使用
reset-item-usage-on-item-use: true

# ============================================
# 封包垃圾郵件設定
# ============================================
# Grim 有時會取消非法封包（如計時器），在每秒取消 X 個封包後，
# 我們應該何時直接踢出玩家？這是必需的，因為某些封包限制器不計算被 Grim 取消的封包。
packet-spam-threshold: 100

# 啟用此選項以在玩家因 packet-spam-threshold 被踢出時列印堆疊追蹤
debug-packet-cancel: false

# ============================================
# 飛行狀態 Ping 限制
# ============================================
# Grim 能夠強制設定離開飛行狀態的玩家不能有超過 X 毫秒的 ping
# 這是因為 Grim 目前不檢測飛行中的玩家
# 要禁用，使用 -1
max-ping-out-of-flying: 1000

# 移除煙火加速時的最大 ping。
# 這可以防止高延遲玩家使用 1 個煙火永遠加速鞘翅。
max-ping-firework-boost: 1000

# ============================================
# 歷史記錄設定
# ============================================
history:
    enabled: true   # 是否啟用歷史記錄

    # 使用 /grim history <玩家> 時每頁應顯示多少條目
    entries-per-page: 15

    # 歷史命令的插入伺服器名稱應該是什麼？
    # 如果你對多個伺服器使用相同的資料庫，這很有用
    server-name: Prison

    # 資料庫設定
    database:
        # 本地存儲使用 SQLITE，如果有外部資料庫使用 MYSQL 或 POSTGRESQL
        # 這僅在伺服器重啟時更新
        type: SQLITE

        # 資料庫連接詳情（僅 MYSQL/POSTGRESQL 需要）
        host: localhost
        port: 3306
        database: grim
        username: root
        password: ""

# 配置版本（請勿更改！）
config-version: 9