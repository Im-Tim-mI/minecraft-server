# EssentialsX 套件配置文件。
# 若此文件中未定義任何套件，插件將嘗試從 'config.yml' 複製套件。

# 所有物品後面【必須】加上數量。
# 套件名稱應為小寫，權限和費用中也會以小寫處理。
# 格式：- 物品[:耐久度] 數量 [附魔:等級]... [物品屬性:值]...
# 物品屬性的詳細資訊請參考：https://wiki.ess3.net/wiki/Item_Meta
#
# 若要讓套件執行指令，請在物品清單中加入 '/<指令>'。使用 {USERNAME} 代表領取套件的玩家帳號名稱。
# 使用 {PLAYER} 代表玩家的顯示名稱。
# 'delay' 是指每次使用套件之間的冷卻時間（秒）。設為 -1 表示一次性套件（只能領取一次）。
#
# 您也可以將套件整理到 'kits' 子目錄中的個別文件。
# Essentials 會將子目錄中所有 '.yml' 文件視為有效的套件文件，並與此處的套件一起載入。
# 'kits' 子目錄中的每個文件必須使用與此文件相同的格式。
#
# 更多資訊請參考：https://wiki.ess3.net/wiki/Kits

kits:
  # ============================================
  # 基礎工具套件
  # ============================================
  new:
    delay: -1
    items:
      - stonesword 1 name:&e新手禮包：石劍              # 石劍 x1
      - stoneshovel 1 name:&e新手禮包：石鏟            # 石鏟 x1
      - stonepickaxe 1 name:&e新手禮包：石鎬           # 石鎬 x1
      - stoneaxe 1 name:&e新手禮包：石斧               # 石斧 x1

